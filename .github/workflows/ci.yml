name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_PATH: ${{ github.workspace }}/out/ci_warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Raw tables from the seed (no API calls, no secrets)
        run: python -m generator.cli fixtures --db "$WAREHOUSE_PATH"
      - name: dbt build on the fixtures, including the ground-truth tests
        working-directory: dbt
        run: |
          dbt deps
          dbt build --vars '{as_of_date: "2026-11-01"}'

  dashboard:
    # Builds the Evidence dashboard on the fixtures, so a broken page fails the PR
    # instead of the daily publication. Nothing is deployed from here.
    runs-on: ubuntu-latest
    needs: test
    env:
      WAREHOUSE_PATH: ${{ github.workspace }}/out/ci_warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m generator.cli fixtures --db "$WAREHOUSE_PATH"
      - name: Marts on the fixtures
        working-directory: dbt
        run: |
          dbt deps
          dbt build --vars '{as_of_date: "2026-11-01"}' --exclude test_type:data
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the dashboard
        run: |
          npx --yes degit evidence-dev/template _evidence
          rm -rf _evidence/pages _evidence/sources
          cp -r dashboard/pages dashboard/sources _evidence/
          cp dashboard/evidence.config.yaml _evidence/evidence.config.yaml
          cp "$WAREHOUSE_PATH" _evidence/sources/warehouse/warehouse.duckdb
          cd _evidence
          npm install
          npm run sources
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t crm-to-cash:ci .
      - name: Smoke test inside the container (no API calls)
        run: docker run --rm crm-to-cash:ci generator.cli seed --dry-run
      - name: Extractor starts inside the container
        run: docker run --rm crm-to-cash:ci extractor.cli --help
