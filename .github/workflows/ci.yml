name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_PATH: ${{ github.workspace }}/out/ci_warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Raw tables from the seed (no API calls, no secrets)
        run: python -m generator.cli fixtures --db "$WAREHOUSE_PATH"
      - name: dbt build on the fixtures, including the ground-truth tests
        working-directory: dbt
        run: |
          dbt deps
          dbt build --vars '{as_of_date: "2026-11-01"}'

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t crm-to-cash:ci .
      - name: Smoke test inside the container (no API calls)
        run: docker run --rm crm-to-cash:ci generator.cli seed --dry-run
      - name: Extractor starts inside the container
        run: docker run --rm crm-to-cash:ci extractor.cli --help
