name: docs

# Publishes the dbt documentation (models, columns, tests and lineage graph) to
# GitHub Pages on every merge to main. Built on the CI fixtures: no secrets needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WAREHOUSE_PATH: ${{ github.workspace }}/out/ci_warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m generator.cli fixtures --db "$WAREHOUSE_PATH"
      - name: Build models and generate the docs site
        working-directory: dbt
        run: |
          dbt deps
          dbt build --vars '{as_of_date: "2026-11-01"}'
          dbt docs generate --static --vars '{as_of_date: "2026-11-01"}'
          mkdir -p ../site
          cp target/static_index.html ../site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
