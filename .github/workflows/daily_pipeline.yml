name: daily-pipeline

# The whole pipeline, every day, without anyone's computer:
# simulate the day -> extract incrementally -> dbt build -> check freshness
# -> publish the dashboard (Evidence) and the dbt docs to GitHub Pages.
# The DuckDB warehouse is carried from one run to the next with the Actions cache.
on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 in Buenos Aires (09:17 UTC); off the hour to avoid queue peaks
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]        # a merge refreshes the site; re-running a day changes nothing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline     # never two runs writing the same warehouse
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      WAREHOUSE_PATH: ${{ github.workspace }}/out/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore the warehouse from the previous run
        uses: actions/cache/restore@v4
        with:
          path: out/warehouse.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Simulate today's activity
        run: python -m generator.cli daily

      - name: Extract new and changed records
        run: python -m extractor.cli --db "$WAREHOUSE_PATH"

      - name: Transform and test
        working-directory: dbt
        run: |
          dbt deps
          dbt build

      - name: Save the warehouse for the next run
        if: always()   # keep the extracted data even if a dbt test failed
        uses: actions/cache/save@v4
        with:
          path: out/warehouse.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Check source freshness
        working-directory: dbt
        run: dbt source freshness

      # ---------------- Site: dashboard at the root, dbt docs at /docs ---------------- #
      - name: dbt docs on today's data
        working-directory: dbt
        run: |
          dbt docs generate --static
          mkdir -p ../site/docs
          cp target/static_index.html ../site/docs/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export the marts for the dashboard
        run: python -m extractor.export_dashboard_data --db "$WAREHOUSE_PATH"

      - name: Build the dashboard (Evidence, open-source packages)
        working-directory: dashboard
        run: |
          npm install
          npm run sources
          npm run build
          cp -r build/. ../site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
